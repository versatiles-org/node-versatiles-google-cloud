<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>VersaTiles</title>
		<meta name="viewport" content="width=device-width" />
		<!--
			Served from the VersaTiles CDN rather than a public package mirror. These
			run on the same origin as the tiles a preview is inspecting, so whoever
			controls them controls that page; keeping them on infrastructure this
			project runs is the difference between one trust boundary and two.

			No integrity hash: the URLs carry no version and are updated in place, so
			a pinned hash would break every preview on the next upstream refresh.
		-->
		<script src="https://tiles.versatiles.org/assets/lib/maplibre-gl/maplibre-gl.js"></script>
		<link
			href="https://tiles.versatiles.org/assets/lib/maplibre-gl/maplibre-gl.css"
			rel="stylesheet"
		/>
		<style>
			body {
				margin: 0;
			}

			#map {
				width: 100vw;
				height: 100vh;
			}
		</style>
	</head>

	<body>
		<div id="map"></div>
		<script>
			(async () => {
				const origin = location.href.replace(/#.*$/, '').replace(/preview$/, '');
				const style = await (await fetch(origin + 'style.json')).json();

				const mapOptions = {
					container: 'map',
					style,
					hash: true,
					dragRotate: false,
					touchZoomRotate: false,
				};

				const source = Object.values(style.sources)[0];
				if (source.bounds) mapOptions.bounds = source.bounds;

				const map = new maplibregl.Map(mapOptions);

				map.addControl(
					new maplibregl.NavigationControl({ showCompass: false, visualizePitch: false }),
				);
			})();
		</script>
	</body>
</html>

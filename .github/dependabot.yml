version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    versioning-strategy: increase-if-necessary
    ignore:
      # The rewrite syntax documented in README.md ("Pattern syntax") relies on
      # custom matching parameters such as ":z(\d+)", which path-to-regexp
      # removed in v7 with no replacement. Upgrading past 6.x is therefore a
      # breaking change to user configuration, not a mechanical bump.
      # Patches and minors within 6.x are still wanted, e.g. for security fixes.
      - dependency-name: path-to-regexp
        versions: ['>=7.0.0']

      # @typescript-eslint/parser declares a peer range of ">=4.8.4 <6.1.0", so
      # TypeScript 7 cannot be installed alongside it — npm fails the whole
      # install with ERESOLVE. Unignore once typescript-eslint supports it.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      action:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
